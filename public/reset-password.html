<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password | StorySiv</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #FBF8F2; --surface: #FFFCF8; --ink: #1A1A1A; --muted: #5A5146; --border: #D8CFC0; --primary: #C2B1D5 !important; --primary-dark: #69577F; --primary-ink: #1A1A1A; --on-primary-hover: #FBF8F2; --font-display: 'Archivo', sans-serif; --font-body: 'Archivo', sans-serif; --font-mono: 'IBM Plex Mono', monospace; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink); font-family: var(--font-body); padding: 1rem; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; width: min(92vw, 24rem);
    box-shadow: 0 12px 28px rgba(55,42,24,0.12); border-top: 3px solid var(--primary); }
  h1 { margin: 0 0 0.3rem; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: var(--ink); letter-spacing: 0; }
  p.sub { margin: 0 0 1.3rem; color: var(--muted); font-size: 0.9rem; font-family: var(--font-body); }
  input { width: 100%; box-sizing: border-box; padding: 0.7rem 0.85rem; border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 11px; font-size: 1rem; margin-bottom: 0.8rem; font-family: var(--font-body); }
  input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  button { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 11px; background: var(--primary);
    color: var(--primary-ink); font-size: 1rem; font-weight: 700; cursor: pointer; font-family: var(--font-body); }
  button:hover { background: var(--primary-dark); color: var(--on-primary-hover); }
  #error { color: #c94b3c; font-size: 0.85rem; min-height: 1.1rem; margin-top: 0.6rem; }
  a { color: var(--primary); }
</style>
</head>
<body>
  <form class="card" id="reset-form">
    <h1>Choose a new password</h1>
    <p class="sub" id="reset-sub">Must be at least 8 characters.</p>
    <input id="password" type="password" placeholder="New password" autocomplete="new-password" autofocus required />
    <input id="password-confirm" type="password" placeholder="Confirm new password" autocomplete="new-password" required />
    <button type="submit" id="reset-submit">Set new password</button>
    <p id="error"></p>
  </form>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('reset-form');
    if (!token) {
      form.innerHTML = '<h1>Invalid link</h1><p class="sub">This reset link is missing its token. Request a new one from the <a href="/login">sign-in page</a>.</p>';
    } else {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('password-confirm').value;
        const errorEl = document.getElementById('error');
        errorEl.textContent = '';
        if (password !== confirm) {
          errorEl.textContent = 'Passwords do not match.';
          return;
        }
        try {
          const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            errorEl.textContent = data.error || 'Something went wrong.';
            return;
          }
          form.innerHTML = '<h1>Password updated</h1><p class="sub">You can now <a href="/login">sign in</a> with your new password.</p>';
        } catch {
          errorEl.textContent = 'Could not reach the server. Try again.';
        }
      });
    }
  </script>
</body>
</html>
