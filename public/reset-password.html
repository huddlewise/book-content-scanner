<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password | KinRead</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --primary: #00a99d; --gradient-brand: linear-gradient(135deg, #07534f 0%, #008f86 48%, #55d7c2 100%); }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #e9f8f6; font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif; padding: 1rem; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  .card { background: #fff; border-radius: 20px; padding: 2rem; width: min(92vw, 24rem);
    box-shadow: 0 18px 40px rgba(18,58,64,0.16); border-top: 3px solid transparent; border-image: var(--gradient-brand) 1; }
  h1 { margin: 0 0 0.3rem; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.5rem; color: #123a40; letter-spacing: -0.02em; }
  p.sub { margin: 0 0 1.3rem; color: #58747a; font-size: 0.9rem; font-family: 'Public Sans', sans-serif; }
  input { width: 100%; box-sizing: border-box; padding: 0.7rem 0.85rem; border: 1px solid #b9d7d4;
    border-radius: 10px; font-size: 1rem; margin-bottom: 0.8rem; font-family: 'Public Sans', sans-serif; }
  input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  button { width: 100%; padding: 0.75rem; border: 0; border-radius: 10px; background: var(--gradient-brand);
    color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: 'Public Sans', sans-serif; }
  button:hover { opacity: 0.92; }
  #error { color: #c94b3c; font-size: 0.85rem; min-height: 1.1rem; margin-top: 0.6rem; }
  a { color: var(--primary); }
</style>
</head>
<body>
  <form class="card" id="reset-form">
    <h1>Choose a new password</h1>
    <p class="sub" id="reset-sub">Must be at least 8 characters.</p>
    <input id="password" type="password" placeholder="New password" autocomplete="new-password" autofocus required />
    <input id="password-confirm" type="password" placeholder="Confirm new password" autocomplete="new-password" required />
    <button type="submit" id="reset-submit">Set new password</button>
    <p id="error"></p>
  </form>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('reset-form');
    if (!token) {
      form.innerHTML = '<h1>Invalid link</h1><p class="sub">This reset link is missing its token. Request a new one from the <a href="/login">sign-in page</a>.</p>';
    } else {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('password-confirm').value;
        const errorEl = document.getElementById('error');
        errorEl.textContent = '';
        if (password !== confirm) {
          errorEl.textContent = 'Passwords do not match.';
          return;
        }
        try {
          const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            errorEl.textContent = data.error || 'Something went wrong.';
            return;
          }
          form.innerHTML = '<h1>Password updated</h1><p class="sub">You can now <a href="/login">sign in</a> with your new password.</p>';
        } catch {
          errorEl.textContent = 'Could not reach the server. Try again.';
        }
      });
    }
  </script>
</body>
</html>
